name: Fork Sync

# 注意：GITHUB_TOKEN 默认无权 push .github/workflows/ 下的文件，
# 且 permissions 里根本没有 'workflows' 这个 key（加了反而报 Invalid workflow file）。
# 上游这次新增了 .github/workflows/pr_agent.yml，所以必须用带 workflow 权限的 PAT。
# 步骤：先按正文建 SYNC_PAT，再跑这个文件。
permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"  # 每天午夜执行
  workflow_dispatch:  # 允许手动触发

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo (full history, required for merge)
        uses: actions/checkout@v4
        with:
          # 关键：必须用 PAT，不能用 GITHUB_TOKEN，否则 push 到 pr_agent.yml 时被平台拒绝
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          # 关键：同样用 PAT，action 内部的 git push 才会带 workflow 权限
          target_repo_token: ${{ secrets.SYNC_PAT }}
          upstream_sync_repo: huangxd-/danmu_api
          upstream_sync_branch: main
          target_sync_branch: main
          test_mode: false

      - name: Check for new commits
        if: success()
        run: echo "Sync completed successfully"
