name: Fork Sync

# 必须同时给 workflows:write：
# 上游新增的 .github/workflows/pr_agent.yml 属于 workflow 文件，
# 只有 contents:write 的 GITHUB_TOKEN push 含 workflow 变更会被
# "refusing to allow a GitHub App to create or update workflow" 拒绝，
# aormsby 动作就以 exit 1 失败。
permissions:
  contents: write
  workflows: write

on:
  schedule:
    - cron: "0 0 * * *"  # 每天午夜执行
  workflow_dispatch:  # 允许手动触发

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo (full history, required for merge)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: huangxd-/danmu_api
          upstream_sync_branch: main
          target_sync_branch: main
          test_mode: false

      - name: Check for new commits
        if: success()
        run: echo "Sync completed successfully"
