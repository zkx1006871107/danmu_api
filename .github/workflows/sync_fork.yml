name: Fork Sync

# SYNC_PAT must permit repository writes, including workflow file updates.
# Keep this fork-specific workflow when merging upstream changes.
permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 00:00（北京时间 08:00）
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: fork-sync-main
  cancel-in-progress: false

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Check sync credential availability
        shell: bash
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [[ -z "$SYNC_PAT" ]]; then
            echo "::error::Repository secret SYNC_PAT is required for syncing workflow updates."
            exit 1
          fi

      - name: Checkout target repo (full history, required for merge)
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SYNC_PAT }}
          ref: main
          fetch-depth: 0

      - name: Sync Upstream
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/huangxd-/danmu_api.git
          # Do not use --depth or --shallow-since: merging needs complete history.
          git fetch --no-tags upstream refs/heads/main:refs/remotes/upstream/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No new upstream commits to sync."
            exit 0
          fi

          sync_workflow='.github/workflows/sync_fork.yml'
          merge_status=0
          git merge --no-ff --no-commit upstream/main || merge_status=$?
          if [[ "$merge_status" -ne 0 ]]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [[ "$conflicts" != "$sync_workflow" ]]; then
              echo "::error::Upstream merge failed or conflicts need manual resolution:"
              printf '%s\n' "$conflicts"
              if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
                git merge --abort
              fi
              exit "$merge_status"
            fi
            echo "Resolving the sync workflow conflict using the fork's version."
          fi

          # Only this workflow is fork-owned; all other conflicts must be reviewed.
          git restore --source=HEAD --staged --worktree -- "$sync_workflow"
          git commit -m "Merge upstream/main; preserve fork sync workflow"
          # A normal push rejects concurrent remote changes instead of overwriting them.
          git push origin HEAD:refs/heads/main

      - name: Check for new commits
        if: success()
        run: echo "Sync completed successfully"
